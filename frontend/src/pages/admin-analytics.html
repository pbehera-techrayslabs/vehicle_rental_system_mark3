<!DOCTYPE html>
<html>

<head>
    <title>Admin Analytics</title>
    <link href="/frontend/dist/styles/output.css" rel="stylesheet">
</head>

<body class="bg-blue-950 min-h-screen">
          <header class="bg-blue-600 text-white p-6 shadow-md flex items-center justify-between">
        <h1 class="text-3xl font-bold grow">Vehicle Rental System</h1>
        <a href="/frontend/src/pages/admin-dashboard.html" 
           class="ml-4 bg-blue-800 hover:bg-blue-900 text-white px-4 py-2 rounded font-semibold">
          Back
        </a>
      </header>


    <div class="max-w-6xl mx-auto p-6 ">
        <h2 class="mb-6 text-3xl text-center font-bold text-white">Admin Analytics Dashboard</h2>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6" id="analyticsCards">

            <div class="card mt-3 p-3 ">
                <h4 class="text-xl font-semibold text-white">Total Vehicles</h4>
                <p id="totalvehicles" class="text-xl text-white "></p>
            </div>

            <div class="card mt-3 p-3">
                <h5 class="text-xl font-semibold text-white">Total Booked vehicles</h5>
                <p id="totalbooked" class="text-xl text-white"></p>
            </div>

            <div class="card mt-3 p-3">
            <h5 class="text-xl font-semibold text-white">Remaining Vehicles</h5>
            <p id="remainingvehicles" class="text-xl text-white"></p>
        </div>
            
            <div class="card mt-3 p-3">
                <h4 class="text-xl font-semibold text-white">Total Revenue</h4>
                <p id="totalrevenue" class="text-xl text-white"></p>
            </div>
        </div>
    </div>

    <script type="module" src="/frontend/dist/scripts/admin-analytics.js"></script>
    <script type="module" src="/frontend/dist/scripts/admin-dashboard.js"></script>

</body>

</html>
